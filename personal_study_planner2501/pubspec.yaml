name: personal_study_planner2501
description: "A Personal Study Planner Flutter project"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Supabase Auth, PostgreSQL and Storage.
  supabase_flutter: ^2.17.2

  # State management for later sessions.
  provider: ^6.1.5+1

  # Local SQLite database.
  sqflite: ^2.4.3

  # Cross-platform file/path handling.
  path: ^1.9.1

  # Allow the user to choose a file from their device
  file_picker: ^10.3.3

  # Select a profile image from the device.
  image_picker: ^1.2.3

  # Internationalisation package for multi-language support. (for our app to display dates and times consistently)
  intl: ^0.20.2

  # Detect changes between offline/online connectivity
  connectivity_plus: ^ 6.1.0

  # Generate stable UUIDS for new cloud records
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Add custom fonts to our application
  fonts:
    - family: caviar
      fonts:
        - asset: assets/fonts/caviar_dreams.ttf
    - family: edge_bold
      fonts:
        - asset: assets/fonts/edge_display_bold.otf
    - family: edge_regular
      fonts:
        - asset: assets/fonts/edge_display_regular.otf
    - family: gvtime
      fonts:
        - asset: assets/fonts/gvtimeregular.ttf
    - family: limelight
      fonts:
        - asset: assets/fonts/limelight.ttf

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
